plugins {
	id 'fabric-loom' version '1.10.1'
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.+"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE.txt") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// ── Modrinth nashr ────────────────────────────────────────────────────────────
modrinth {
	token = System.getenv("MODRINTH_TOKEN")
	projectId = project.modrinth_project_id
	versionNumber = project.mod_version
	versionType = project.release_type      // "release", "beta", "alpha"
	uploadFile = remapJar
	gameVersions = ["1.20.6", "1.21", "1.21.1", "1.21.3", "1.21.4", "1.21.5", "1.21.8"]
	loaders = ["fabric", "quilt"]
	changelog = System.getenv("CHANGELOG") ?: "Yangi versiya."
	dependencies {
		required.project "fabric-api"
		required.project "cloth-config"
		required.project "modmenu"
	}
}

tasks.modrinth.dependsOn(tasks.remapJar)

// ── Maven publish (ixtiyoriy) ──────────────────────────────────────────────────
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {}
}
